# SLM-focused variant of the 16-frame beam-evolution ladder.
# Same four rungs / lab mapping; selection starts on [SLM_01] for HITL export.

schema: 1
title: Photonic Ladder Diagram – SLM Playlist + Lab Mapping
version: 0.3.0
wavelength_nm: 532.0
L_max: 8
grid_size: 64
scan_active: true
edit_mode: true
cycle: 0
selected_node_id: rung2.slm
glow_until_trigger: true
n_pulse_frames: 16
frame_index: 0
alarm: ""

rungs:
  - id: rung1
    number: 1
    title: INITIAL
    stage: initial
    subtitle: Collimated pulse
    help: Frames 1–3 axial collimated rainbow pulse; frames 4–5 elongated pulse streak.
    workbench:
      kind: identity
      params: {}
    contacts:
      - {id: pulse_in, tag: PULSE_IN, kind: NO, closed: true, help: Input pulse trigger}
      - {id: shutter, tag: SHUTTER, kind: NO, closed: true, help: Laser shutter interlock}
      - {id: trig_532, tag: TRIG_532, kind: trigger, closed: true, help: "532 nm fire"}
    axial:
      id: axial
      view: axial
      title: AXIAL / PHASE-FRONT
      scale: INTENSITY
      frame_ids: [1, 2, 3]
    spatiotemporal:
      id: st
      view: spatiotemporal
      title: SPATIOTEMPORAL / LENGTH
      scale: INTENSITY
      frame_ids: [4, 5]
    equipment:
      - {id: laser, tag: "[LASER_532]", name: 532 nm Laser, kind: laser}
      - {id: expander, tag: "[BE_01]", name: Beam Expander, kind: expander}
      - {id: dice, tag: "[DICE_01]", name: Object Dice Stage, kind: stage}
      - {id: l1, tag: "[L1]", name: Lens L1, kind: lens}
      - {id: iris, tag: "[IRIS_01]", name: Iris, kind: iris}

  - id: rung2
    number: 2
    title: SLM STAGE
    stage: slm
    subtitle: Quaternion spiral mask
    help: Push this rung to HITL / export-slm.
    workbench:
      kind: spiral_phase
      params: {ell: 1}
    contacts:
      - {id: slm_en, tag: SLM_EN, kind: NO, closed: true}
      - {id: hwp_in, tag: HWP_IN, kind: NO, closed: true}
      - {id: phase_ld, tag: PHASE_LD, kind: trigger, closed: true, help: Load phase playlist}
      - {id: ell_set, tag: ELL_SET, kind: param, closed: true, value: "1"}
    axial:
      id: axial
      view: axial
      title: AXIAL / PHASE-FRONT
      scale: PHASE
      frame_ids: [6, 7, 8]
    spatiotemporal:
      id: st
      view: spatiotemporal
      title: SPATIOTEMPORAL / LENGTH
      scale: INTENSITY
      frame_ids: [9, 10]
    equipment:
      - {id: slm, tag: "[SLM_01]", name: SLM, kind: slm, help: Spatial Light Modulator}
      - {id: hwp, tag: "[HWP_01]", name: "HWP (λ/2)", kind: hwp}
      - {id: l3, tag: "[L3]", name: Lens L3, kind: lens}
      - {id: gpd, tag: "[GPD_01]", name: GPD, kind: detector}

  - id: rung3
    number: 3
    title: HELICAL FORMATION
    stage: helical
    subtitle: Nested helical wavefronts
    workbench:
      kind: trajectoid
      params: {n_trenches: 8, winding: 2, live: false}
    contacts:
      - {id: diff_en, tag: DIFF_EN, kind: NO, closed: true}
      - {id: lcp_in, tag: LCP_IN, kind: NO, closed: true}
      - {id: twist, tag: TWIST, kind: param, closed: true, value: "3"}
    axial:
      id: axial
      view: axial
      title: AXIAL / PHASE-FRONT
      scale: INTENSITY
      frame_ids: [11, 12]
    spatiotemporal:
      id: st
      view: spatiotemporal
      title: SPATIOTEMPORAL / LENGTH
      scale: INTENSITY
      frame_ids: [13]
    equipment:
      - {id: diffuser, tag: "[DIFF_01]", name: Rotating Diffuser, kind: diffuser}
      - {id: l4, tag: "[L4]", name: Lens L4, kind: lens}
      - {id: lcp, tag: "[LCP_01]", name: LCP, kind: polarizer}

  - id: rung4
    number: 4
    title: MULTI-LAYER / DETECTION
    stage: detect
    subtitle: Dense helical stack → cameras
    workbench:
      kind: spiral_phase
      params: {ell: 3}
    contacts:
      - {id: cam1_en, tag: CAM1_EN, kind: NO, closed: true}
      - {id: cam2_en, tag: CAM2_EN, kind: NO, closed: true}
      - {id: fiber_tx, tag: FIBER_TX, kind: NO, closed: true}
      - {id: vqc_go, tag: VQC_GO, kind: trigger, closed: true}
    axial:
      id: axial
      view: axial
      title: AXIAL / PHASE-FRONT
      scale: INTENSITY
      frame_ids: [14, 15]
    spatiotemporal:
      id: st
      view: spatiotemporal
      title: SPATIOTEMPORAL / LENGTH
      scale: INTENSITY
      frame_ids: [16]
    equipment:
      - {id: cam1, tag: "[CAM1]", name: Cam1 (CCD), kind: camera}
      - {id: cam2, tag: "[CAM2]", name: Cam2 (EMCCD), kind: camera}
      - {id: fiber, tag: "[FIBER_01]", name: Online Transmission Fiber Path, kind: fiber}
      - {id: analysis, tag: "[NODE_AX]", name: To Analysis Node, kind: node}
