[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vqc-workbench"
version = "0.3.0"
description = "VQC-native photonic workbench: edit metamaterials and gratings, simulate OAM modes, run the Vortex Quaternion Conduit pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kinaar8340" }]
keywords = [
    "photonics",
    "oam",
    "metamaterial",
    "grating",
    "quaternion",
    "vqc",
    "hopf",
    "workbench",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.28", "plotly>=5.0", "matplotlib>=3.7"]
slm = ["pillow>=10.0"]
viz = ["matplotlib>=3.7", "plotly>=5.0"]
fullwave = []
rcwa = ["grcwa>=0.1"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]
all = ["vqc-workbench[ui,slm,viz,dev,rcwa]"]

[project.scripts]
vqc-workbench = "vqc_workbench.cli:main"

[project.urls]
Homepage = "https://github.com/kinaar8340/vqc_workbench"
Ecosystem = "https://github.com/kinaar8340"

[tool.hatch.build.targets.wheel]
packages = ["src/vqc_workbench"]

[tool.hatch.build.targets.wheel.sources]
"src/vqc_workbench" = "vqc_workbench"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/configs",
    "/README.md",
    "/LICENSE",
    "/IP_NOTICE.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
